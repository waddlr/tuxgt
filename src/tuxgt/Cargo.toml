[workspace]
resolver = "2"
members = [
    "tuxgt-core",
    "tuxgt-app",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.9.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fluent = "0.16"
futures-util = "0.3"
goblin = "0.10"
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }
libc = "0.2"
keyvalues-parser = "0.2"
kkfetch = { git = "https://github.com/kk376/kkfetch", tag = "v0.16.0" }
log = "0.4"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "stream",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
steamlocate = "2.1"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
vergen = { version = "9", default-features = false, features = ["build"] }
unic-langid = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.release-trace]
inherits = "release"
strip = false
debug = "line-tables-only"
