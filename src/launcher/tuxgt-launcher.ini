; Init config. Environment wins over this file:
;   TUXGT_DEPOT       central depot of versioned injector trees
;                     (TUXGT_ADDONS kept as compat fallback)
;   TUXGT_GAMES       parent of per-game dirs (installed default $HOME/tuxgt/games;
;                     portable default: games/ next to the launcher script)
;   TUXGT_LAUNCHER_SO path to libtuxgt-launcher.so (default: next to script, build/, installed)
;
; Per-game sections are keyed by exe stem: [SkyrimSE] covers SkyrimSE.exe.
; Type is informational only (reported in the status file, never mapped).
; LoadDLL: DLLs to stage from the depot, then LoadLibrary in list order
; ("name", or "dest=src" rename/subpath for proxy slots like
; dxgi.dll=OptiScaler/optiscaler-v3/OptiScaler.dll).
; IncludeFile: staged-only data, same "dest=src" files plus "destdir/=srcdir/"
; tree mirrors (e.g. OptiScaler/=OptiScaler/optiscaler-v3/OptiScaler/, or
; .addon64 files, which ReShade discovers in the per-game base itself).
; Only *.dll entries load. Depot copy always wins. No "..", no absolute.
; Unstaging: on ok runs the loader removes previously staged files the
; current config no longer references (manifest = prior status file).
; Foreign/hand-placed files are never deleted; generated files (logs,
; quirk-touched ini) stay. Removing a game section orphans its base:
; delete the GamesDir/<stem>/ dir by hand.
; Values accept commas; repeat the key for long lists (occurrences accumulate).
;   TUXGT_DEPOT       central depot (default: addons/ next to this ini)
[Init]
GamesDir=
DepotDir=

[Defaults]
Type=dx12_64

[ExampleGame]
Type=dx12_64
LoadDLL=d3d12.dll=ReShade/6.8.0.2155/ReShade64.dll
